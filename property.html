<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">Property — Afraviva Homes</title>
<meta id="doc-description" name="description" content="Property details from Afraviva Homes.">
<link id="doc-canonical" rel="canonical" href="https://judekioko.github.io/afraviva/property.html">
<meta id="og-type" property="og:type" content="website">
<meta property="og:site_name" content="Afraviva Homes">
<meta id="og-title" property="og:title" content="Property — Afraviva Homes">
<meta id="og-description" property="og:description" content="Property details from Afraviva Homes.">
<meta id="og-url" property="og:url" content="https://judekioko.github.io/afraviva/property.html">
<meta id="og-image" property="og:image" content="https://judekioko.github.io/afraviva/assets/img/afraviva-logo-full.png">
<meta name="twitter:card" content="summary_large_image">
<meta id="twitter-title" name="twitter:title" content="Property — Afraviva Homes">
<meta id="twitter-description" name="twitter:description" content="Property details from Afraviva Homes.">
<meta id="twitter-image" name="twitter:image" content="https://judekioko.github.io/afraviva/assets/img/afraviva-logo-full.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="site-header"></div>

<main id="property-main">
  <!-- Populated by JS. See #not-found-state for the fallback. -->
</main>

<template id="not-found-state">
  <div class="page-header">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> / Properties</div>
      <h1>Property not found</h1>
      <p class="lede">We couldn't find that listing. It may have moved — browse the full portfolio instead.</p>
      <div class="hero-cta" style="margin-top:24px;">
        <a href="properties.html" class="btn btn-primary">View all properties</a>
      </div>
    </div>
  </div>
</template>

<div id="site-footer"></div>

<script src="assets/js/svg-art.js"></script>
<script src="assets/js/properties-data.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  const p = afravivaGetProperty(slug);
  const main = document.getElementById("property-main");

  if(!p){
    main.appendChild(document.getElementById("not-found-state").content.cloneNode(true));
    return;
  }

  const BASE_URL = "https://judekioko.github.io/afraviva/";
  const pageTitle = p.name + " — Afraviva Homes";
  const plainDescription = (() => {
    const tmp = document.createElement("div");
    tmp.innerHTML = p.description;
    const text = tmp.textContent.trim();
    return text.length > 157 ? text.slice(0, 157).trim() + "…" : text;
  })();
  const pageUrl = BASE_URL + "property.html?slug=" + p.slug;
  const pageImage = BASE_URL + (p.coverImage || "assets/img/afraviva-logo-full.png");

  document.getElementById("doc-title").textContent = pageTitle;
  document.getElementById("doc-description").setAttribute("content", plainDescription);
  document.getElementById("doc-canonical").setAttribute("href", pageUrl);
  ["og-title", "twitter-title"].forEach(id => document.getElementById(id).setAttribute("content", pageTitle));
  ["og-description", "twitter-description"].forEach(id => document.getElementById(id).setAttribute("content", plainDescription));
  ["og-image", "twitter-image"].forEach(id => document.getElementById(id).setAttribute("content", pageImage));
  document.getElementById("og-url").setAttribute("content", pageUrl);
  document.getElementById("og-type").setAttribute("content", "product");

  const tagClass = p.status === "ready" ? "tag-ready" : (p.status === "progress" ? "tag-progress" : "tag-tbc");

  const isTBC = p.status === "tbc";

  const factsHTML = (p.facts && p.facts.length ? p.facts : [
    { label:"Status", value:p.statusLabel },
    { label:"Neighbourhood", value:p.neighbourhood },
    { label:"Region", value:p.regionLabel },
    { label:"Timeline", value:p.quarterLabel }
  ]).map(f => `
    <div class="fact">
      <div class="fact-label">${f.label}</div>
      <div class="fact-val">${f.value}</div>
    </div>`).join("");

  const specsHTML = (p.specs && p.specs.length) ? `
    <div class="spec-list">
      ${p.specs.map(s => `<div class="spec-row"><span>${s.label}</span><span>${s.value}</span></div>`).join("")}
    </div>` : `<p style="margin-top:20px;color:var(--muted);font-size:14.5px;">Full specifications will be published once this development's details are confirmed.</p>`;

  const amenitiesHTML = (p.amenities && p.amenities.length) ? `
    <div class="section-tight" style="background:var(--paper-alt);">
      <div class="wrap">
        <span class="eyebrow">On site</span>
        <h2 style="margin-bottom:28px;">Amenities at ${p.name}.</h2>
        <div class="amenity-grid">
          ${p.amenities.map(a => `<div class="amenity-item">${a}</div>`).join("")}
        </div>
      </div>
    </div>` : "";

  const investmentHTML = (p.investment && p.investment.length) ? `
    <div class="section-tight">
      <div class="wrap">
        <span class="eyebrow">Numbers</span>
        <h2 style="margin-bottom:24px;">Investment highlights.</h2>
        <div class="spec-list" style="max-width:640px;">
          ${p.investment.map(s => `<div class="spec-row"><span>${s.label}</span><span>${s.value}</span></div>`).join("")}
        </div>
      </div>
    </div>` : "";

  const pricingHTML = (p.pricing && p.pricing.length) ? `
    <div class="section-tight" style="background:var(--paper-alt);">
      <div class="wrap">
        <span class="eyebrow">Pricing</span>
        <h2 style="margin-bottom:28px;">Unit pricing at ${p.name}.</h2>
        <div class="pricing-grid">
          ${p.pricing.map(pr => `
            <div class="pricing-card">
              <h3>${pr.type}</h3>
              <div class="spec-list">
                ${pr.details.map(d => `<div class="spec-row"><span>${d.label}</span><span>${d.value}</span></div>`).join("")}
              </div>
            </div>`).join("")}
        </div>
      </div>
    </div>` : "";

  const enquiryBlock = isTBC ? `
    <div class="enquiry-box">
      <h3>Get notified</h3>
      <p class="hint">${p.name}'s details are still being finalised. Leave your email and we'll reach out the moment they're confirmed.</p>
      <form>
        <div class="field">
          <label for="tbc-email">Email address</label>
          <input id="tbc-email" type="email" required placeholder="you@email.com">
        </div>
        <button type="submit" class="btn btn-primary">Notify me</button>
      </form>
    </div>` : `
    <div class="enquiry-box">
      <h3>Enquire about renting ${p.name}</h3>
      <p class="hint">${p.status === "ready" ? "Ready to move in — get in touch to arrange a viewing." : "Register your interest to rent and we'll keep you posted as construction progresses."}</p>
      <form>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" type="text" required placeholder="Jane Wanjiru">
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" required placeholder="+254 7__ ___ ___">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" rows="3" placeholder="I'd like to know more about rental availability and pricing.">I'd like to know more about renting at ${p.name}.</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send enquiry</button>
      </form>
      <div class="enquiry-divider">or</div>
      <a href="#" class="whatsapp-btn" data-whatsapp="${p.name}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.06-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.62-1.28 1.18-1.77 1.24-.45.06-1.02.09-1.65-.1-.38-.12-.87-.28-1.5-.55-2.64-1.14-4.36-3.8-4.5-3.98-.13-.18-1.08-1.44-1.08-2.75s.68-1.94.92-2.2c.24-.26.53-.33.7-.33h.5c.16 0 .38-.06.6.45.22.52.75 1.8.82 1.93.07.13.11.28.02.46-.09.18-.14.28-.27.44-.13.15-.28.34-.4.46-.13.13-.27.27-.12.53.16.26.7 1.16 1.5 1.88 1.03.92 1.9 1.2 2.16 1.34.26.13.42.11.57-.07.16-.18.66-.77.84-1.03.18-.26.35-.22.6-.13.24.09 1.53.72 1.79.85.26.13.44.2.5.31.06.11.06.62-.16 1.25z"/></svg>
        WhatsApp us about ${p.name}
      </a>
    </div>`;

  const galleryHTML = (p.gallery && p.gallery.length) ? `
    <div class="section-tight">
      <div class="wrap">
        <span class="eyebrow">Gallery</span>
        <h2 style="margin-bottom:28px;">Inside ${p.name}.</h2>
        <div class="photo-grid">
          ${p.gallery.map(g => `
            <div class="photo-item">
              <img src="${g.src}" alt="${p.name} — ${g.caption}" loading="lazy">
              <span class="photo-caption">${g.caption}</span>
            </div>`).join("")}
        </div>
      </div>
    </div>` : "";

  const videoHTML = p.video ? `
    <div class="section-tight">
      <div class="wrap">
        <span class="eyebrow">Watch</span>
        <h2 style="margin-bottom:28px;">See ${p.name}.</h2>
        <div class="video-embed-card">
          <iframe
            src="https://www.youtube-nocookie.com/embed/${p.video}"
            title="${p.name} — video"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>` : "";

  const locationHTML = (p.lat && p.lng) ? `
    <div class="section-tight">
      <div class="wrap">
        <div class="section-head" style="margin-bottom:24px;">
          <div>
            <span class="eyebrow">Exact location</span>
            <h2>Where ${p.name} sits.</h2>
          </div>
          <a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener" class="btn btn-ghost">Get directions →</a>
        </div>
        <div class="map-embed-card">
          <iframe
            src="https://maps.google.com/maps?q=${p.lat},${p.lng}(${encodeURIComponent(p.name)})&z=15&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Map showing the location of ${p.name}"
            aria-label="Map showing the location of ${p.name}">
          </iframe>
        </div>
        <p class="map-note">${p.neighbourhood}</p>
      </div>
    </div>` : `
    <div class="section-tight">
      <div class="wrap">
        <span class="eyebrow">Exact location</span>
        <h2>Location to be announced.</h2>
        <p class="lede">A map will appear here once ${p.name}'s address is confirmed.</p>
      </div>
    </div>`;

  main.innerHTML = `
    <div class="page-header">
      <div class="wrap">
        <div class="breadcrumb"><a href="index.html">Home</a> / <a href="properties.html">Properties</a> / ${p.name}</div>
        <span class="tag ${tagClass}">${p.statusLabel}</span>
      </div>
    </div>

    <div class="p-hero">
      <div class="p-hero-art">${p.coverImage ? `<img src="${p.coverImage}" alt="${p.name}">` : afravivaArt(p.artVariant, p.status)}</div>
      <div class="p-hero-info wrap" style="padding-left:0;">
        <span class="eyebrow">${p.neighbourhood} · ${p.regionLabel}</span>
        <h1 class="p-name">${p.name}</h1>
        <div class="p-loc">${p.developer} &middot; ${p.quarterLabel}</div>
        <p class="lede">${p.description}</p>
        <div class="facts-strip">${factsHTML}</div>
      </div>
    </div>

    <div class="wrap">
      <div class="p-body-grid">
        <div class="prose">
          <h2>About this development</h2>
          <p>${p.longDescription || p.description}</p>
          <h2 style="margin-top:44px;">Specifications</h2>
          ${specsHTML}
        </div>
        ${enquiryBlock}
      </div>
    </div>

    ${galleryHTML}
    ${videoHTML}
    ${amenitiesHTML}
    ${pricingHTML}
    ${investmentHTML}
    ${locationHTML}

    <div class="related-strip">
      <div class="wrap">
        <div class="section-head">
          <div>
            <span class="eyebrow">Nearby on the ledger</span>
            <h2>Other Afra<span class="v-flag">V</span>iva addresses</h2>
          </div>
          <a href="properties.html" class="btn btn-ghost">View all →</a>
        </div>
        <div class="grid-properties" id="related-grid"></div>
      </div>
    </div>
  `;

  document.querySelectorAll("[data-whatsapp]").forEach(el => {
    el.href = whatsappLink(el.dataset.whatsapp === "general" ? null : el.dataset.whatsapp);
  });
  /* form submit handling (routes to WhatsApp) is wired centrally in main.js */

  const related = AFRAVIVA_PROPERTIES.filter(x => x.slug !== p.slug && x.region === p.region).slice(0,3);
  const fallback = related.length ? related : AFRAVIVA_PROPERTIES.filter(x => x.slug !== p.slug).slice(0,3);
  document.getElementById("related-grid").innerHTML = fallback.map(afravivaCardHTML).join("");
})();
</script>
</body>
</html>
